<title>Jogo da Memória</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,500&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Visual único dos jogos clássicos: papel creme de livro ilustrado, igual à estante e aos filmes. */
:root{
  --paper:#fbf3e3; --paper2:#f3e6cc; --card:#fffaf0; --ink:#3a2c24; --muted:#7d6a58; --gold:#c98a3a; --gold2:#e8b65a;
  --leaf:#5f9a4c; --sky:#6fa8e0; --rose:#d97b6c; --ok:#6aa653; --bad:#d9634f;
  --display:'Fraunces', Georgia, 'Times New Roman', serif; --body:'Nunito', system-ui, sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none;
  background-image:radial-gradient(circle at 12% 0%, rgba(232,182,90,.18), transparent 40%), radial-gradient(circle at 92% 8%, rgba(111,168,224,.15), transparent 40%);
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:12px 32px}
.wrap{max-width:900px;margin:0 auto;display:grid;gap:16px}
.wrap .wrap{width:100%;max-width:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:6px 0;background:var(--paper)}
.top h1{font:800 clamp(22px,5.4vw,32px)/1 var(--display);margin:0;text-align:center;flex:1;text-wrap:balance}
.pill{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font:800 14px var(--body);border-radius:999px;padding:9px 14px;background:var(--card);box-shadow:0 0 0 1px rgba(120,90,50,.15);border:0;cursor:pointer}
.pill:focus-visible,.btn:focus-visible,.opt:focus-visible,.choice:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn{border:0;border-radius:999px;padding:13px 24px;font:800 17px var(--body);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.go{color:#fff;background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:0 8px 20px rgba(201,138,58,.3)}
.btn.ghost{color:var(--ink);background:transparent;border:2px solid rgba(58,44,36,.18)}
.seg{display:inline-flex;background:var(--card);border-radius:999px;padding:4px;gap:4px;box-shadow:0 0 0 1px rgba(120,90,50,.15);flex-wrap:wrap;justify-content:center}
.seg button{border:0;background:transparent;border-radius:999px;padding:9px 16px;font:800 14px var(--body);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.lead{margin:0;color:var(--muted);text-align:center;line-height:1.5}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.choice{background:var(--card);border:0;border-radius:16px;padding:14px 12px;display:grid;justify-items:center;gap:8px;cursor:pointer;box-shadow:0 10px 24px rgba(90,60,30,.12), 0 0 0 1px rgba(120,90,50,.1);font:800 16px/1.2 var(--display);color:var(--ink)}
.choice canvas{width:96px;height:96px}
.choice small{font:700 12px var(--body);color:var(--muted)}
.stars{font-size:38px;letter-spacing:6px}
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;background:rgba(40,28,20,.35);padding:20px 16px}
.page{margin:auto;background:var(--paper);border-radius:8px;box-shadow:0 24px 60px rgba(0,0,0,.3), inset 0 0 0 1px rgba(120,90,50,.15), inset 0 0 60px rgba(200,160,100,.22);padding:26px 28px;text-align:center;max-width:440px;display:grid;gap:12px;justify-items:center;transform:rotate(-.5deg)}
.page h2{font:800 clamp(30px,8vw,42px)/1.05 var(--display);margin:0}
.eyebrow{font:800 12px var(--body);letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

/* Layout: cabeçalho, escolha de nível e um tabuleiro de cartas que se ajusta à tela. */
.bar{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font:800 15px var(--body);color:var(--muted)}
.bar b{color:var(--ink);font-variant-numeric:tabular-nums}
.board{display:grid;gap:10px;margin:0 auto;width:100%;max-width:640px}
.card{position:relative;aspect-ratio:3/4;max-width:100%;perspective:800px;border:0;padding:0;background:transparent;cursor:pointer}
.card .in{position:absolute;inset:0;transition:transform .45s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.card.up .in,.card.done .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;box-shadow:0 8px 18px rgba(90,60,30,.16), 0 0 0 1px rgba(120,90,50,.15)}
.back{background:linear-gradient(160deg,#f6e3bc,#e3c38a);}
.back::before{content:"";position:absolute;inset:7px;border:2px solid rgba(255,250,235,.8);border-radius:8px}
.back span{font:800 clamp(20px,5vw,30px) var(--display);color:#fff8e8;text-shadow:0 2px 0 rgba(150,100,40,.35)}
.front{background:var(--card);transform:rotateY(180deg);grid-template-rows:1fr auto;padding:8px 6px 6px;gap:2px}
.front canvas{max-width:100%;height:auto}
.front em{font:800 clamp(11px,2.6vw,14px)/1.1 var(--body);font-style:normal;text-align:center}
.card.done .front{box-shadow:0 0 0 3px var(--ok), 0 8px 18px rgba(90,60,30,.16)}
.card.shake .in{animation:shake .35s}
@keyframes shake{0%,100%{transform:rotateY(180deg) translateX(0)}25%{transform:rotateY(180deg) translateX(-5px)}75%{transform:rotateY(180deg) translateX(5px)}}
</style>

<div class="wrap">
  <div class="top"><a class="pill" href="index.html">📚 Estante</a><h1>Jogo da Memória</h1><button class="pill" id="vo" aria-label="Narração ligada">🔊</button></div>
  <section id="pick" class="wrap">
    <p class="lead">Vire duas cartas e encontre os pares de personagens e animais das histórias da Bíblia.</p>
    <div class="choices" id="levels"></div>

    <div class="bar"><span>Pares: <b id="pairs">0 / 0</b></span><span>Jogadas: <b id="moves">0</b></span><button class="pill" id="restart">↻ Recomeçar</button></div>
    <div class="board" id="board"></div>
  </section>
</div>

/* arte.js — o mesmo desenho dos personagens dos filmes do Biblinha Play */
let ctx=null; let G=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
const ss=(a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const hex=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));
const mix=(a,b,t)=>{ const A=hex(a),B=hex(b); return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')'; };
const rgba=(h,a)=>{ const c=hex(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };

/* ===== luz da cena (todas as cenas usam o mesmo sistema) ===== */
const LIGHT={dx:1, rim:'#fff1c8', rimA:.55};
function vgrad(y0,y1,stops){ const g=ctx.createLinearGradient(0,y0,0,y1); stops.forEach(([o,c])=>g.addColorStop(o,c)); return g; }
function ell(x,y,rx,ry,fill,rot){ ctx.beginPath(); ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,7); ctx.fillStyle=fill; ctx.fill(); }
function shade(x,y,rx,ry,top,bot,rot){ ell(x,y,rx,ry,vgrad(y-ry,y+ry,[[0,top],[1,bot]]),rot); }
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function softShadow(x,y,rx,a){ const g=ctx.createRadialGradient(x,y,1,x,y,rx); g.addColorStop(0,`rgba(40,25,20,${a||.3})`); g.addColorStop(1,'rgba(40,25,20,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(x,y,rx,rx*.25,0,0,7); ctx.fill(); }
function rim(x,y,rx,ry,a0,a1){ ctx.save(); ctx.strokeStyle=rgba(LIGHT.rim.startsWith('#')?LIGHT.rim:'#fff1c8', LIGHT.rimA); ctx.lineWidth=2.6; ctx.lineCap='round'; ctx.beginPath();
  const s=LIGHT.dx>0?0:Math.PI; ctx.ellipse(x,y,rx-1,ry-1,0,s+(a0||-1.1),s+(a1||1.1)); ctx.stroke(); ctx.restore(); }
function glow(x,y,r,color,a){ const g=ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,rgba(color,a)); g.addColorStop(1,rgba(color,0)); ctx.fillStyle=g; ctx.fillRect(x-r,y-r,r*2,r*2); }

    shade(2,-14,9,10,'#3a6ed0','#24459a'); ctx.strokeStyle='#3a6ed0'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(6,-20); ctx.quadraticCurveTo(10,-28,10,-32); ctx.stroke(); shade(11,-34,5,5,'#4a7ee0','#2a50a8');
    ell(15,-34,3,1.4,'#e6974d'); ell(12,-35,1.1,1.1,'#fff'); for(const dx of [-2,1,4]){ ctx.strokeStyle='#2a50a8'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(10,-38); ctx.lineTo(10+dx,-45); ctx.stroke(); ell(10+dx,-46,1.6,1.6,'#3fa38a'); } }
  ctx.restore();
}
let o_leaf=false;
/* ===== a arca (cresce conforme o capítulo) ===== */
function ark(x,y,stage,o){
  o=o||{}; ctx.save(); ctx.translate(x,y); if(o.rock) ctx.rotate(o.rock);
  const L=360, Ht=150;
  softShadow(0,4,240,.35);
  const kS=ss(0,.12,stage), ribS=ss(.08,.38,stage), hullS=ss(.35,.72,stage), houseS=ss(.7,.9,stage), doneS=ss(.9,1,stage);
  // quilha
  ctx.fillStyle='#5a3a22'; rr(-L/2*kS,-12,L*kS,12,5); ctx.fill();
  const hull=()=>{ ctx.beginPath(); ctx.moveTo(-L/2-20,-Ht); ctx.lineTo(L/2+20,-Ht); ctx.quadraticCurveTo(L/2+10,-20,L/2-60,0); ctx.lineTo(-L/2+60,0); ctx.quadraticCurveTo(-L/2-10,-20,-L/2-20,-Ht); ctx.closePath(); };
  // costelas
  ctx.strokeStyle='#7a4a2a'; ctx.lineWidth=7; ctx.lineCap='round';
  const nr=Math.floor(ribS*12); for(let i=0;i<nr;i++){ const rx=-L/2+20+i*(L-40)/11; ctx.beginPath(); ctx.moveTo(rx,0); ctx.quadraticCurveTo(rx+(rx<0?-14:14),-Ht*.5,rx+(rx<0?-22:22),-Ht); ctx.stroke(); }
  // casco (tábuas de baixo para cima)
  if(hullS>0){ ctx.save(); hull(); ctx.clip(); const top=lerp(0,-Ht-4,hullS);
    ctx.fillStyle=vgrad(-Ht,0,[[0,'#c88a52'],[1,'#7a4a28']]); ctx.fillRect(-L,top,L*2,-top+4);
    ctx.strokeStyle='rgba(60,30,12,.4)'; ctx.lineWidth=2.5; for(let yy=-6;yy>top;yy-=17){ ctx.beginPath(); ctx.moveTo(-L,yy); ctx.lineTo(L,yy); ctx.stroke(); }
    ctx.fillStyle='rgba(0,0,0,.18)'; ctx.fillRect(-L, top, L*2, 8);
    ctx.restore(); if(hullS>=1){ ctx.strokeStyle=rgba('#fff1c8',.35); ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(-L/2-18,-Ht+2); ctx.lineTo(L/2+18,-Ht+2); ctx.stroke(); } }
  // casa no convés
  if(houseS>0){ ctx.save(); ctx.globalAlpha=houseS; const hy=-Ht, hh=90*houseS;
    ctx.fillStyle=vgrad(hy-hh,hy,[[0,'#d9a46c'],[1,'#a8703f']]); rr(-130,hy-hh,240,hh,8); ctx.fill();
    ctx.fillStyle=vgrad(hy-hh-60,hy-hh,[[0,'#a5563f'],[1,'#7a3a2a']]); ctx.beginPath(); ctx.moveTo(-152,hy-hh+4); ctx.lineTo(-10,hy-hh-58); ctx.lineTo(132,hy-hh+4); ctx.closePath(); ctx.fill();
    if(doneS>0){ const lit=o.lit==null?.6:o.lit; for(const wx of [-100,-60,40,80]){ ctx.fillStyle=mix('#4a2f22','#ffd27a',lit); rr(wx,hy-60,24,22,5); ctx.fill(); if(lit>.3) glow(wx+12,hy-49,38,'#ffc060',lit*.45); }
      ctx.fillStyle=mix('#3a2418','#ffc870',o.doorLit||0); rr(-24,hy-74,38,74,14); ctx.fill(); }
    ctx.restore(); }
  // rampa
  if(o.ramp!=null && o.ramp>0){ ctx.save(); ctx.translate(-5,-Ht+2); ctx.rotate(lerp(Math.PI,.62,o.ramp)); ctx.fillStyle=vgrad(0,10,[[0,'#b97c47'],[1,'#7a4a28']]); rr(-10,0,26,Ht*1.25,4); ctx.fill(); ctx.restore(); }
  // andaime
  if(stage<.97 && stage>.2){ ctx.strokeStyle='#8a6a48'; ctx.lineWidth=4; for(const sx of [-L/2-40, L/2+40]){ ctx.beginPath(); ctx.moveTo(sx,0); ctx.lineTo(sx,-Ht-30); ctx.stroke(); for(let k=0;k<4;k++){ ctx.beginPath(); ctx.moveTo(sx-14,-k*44-10); ctx.lineTo(sx+14,-k*44-10); ctx.stroke(); } } }
  ctx.restore();
}
function waves(y,amp,c1,c2,speed,front){ ctx.beginPath(); ctx.moveTo(-1600,700); for(let x=-1600;x<=1600;x+=16){ ctx.lineTo(x, y+Math.sin(x*.012+G*speed)*amp+Math.sin(x*.031-G*speed*1.4)*amp*.4); } ctx.lineTo(1600,700); ctx.closePath();
  ctx.fillStyle=vgrad(y-amp,y+260,[[0,c1],[1,c2]]); ctx.fill(); ctx.strokeStyle=rgba('#ffffff',front?.45:.25); ctx.lineWidth=front?4:2.5; ctx.stroke(); }
function rain(a,slant){ if(a<=0) return; ctx.save(); ctx.strokeStyle=`rgba(210,225,245,${.45*a})`; ctx.lineWidth=1.6; ctx.beginPath(); const n=Math.floor(160*a);
  for(let i=0;i<n;i++){ const x=((i*61.7+G*140*(slant||1))%(W+80))-40, y=((i*113.1+G*900)%(H+60))-30; ctx.moveTo(x,y); ctx.lineTo(x-(slant||1)*6,y+20); } ctx.stroke(); ctx.restore(); }


/* ===== enfeites da "Minha Arca" ===== */
function decor(id,x,y,s){ ctx.save(); ctx.translate(x,y); ctx.scale(s||1,s||1);
  if(id==='girassol'){ ctx.strokeStyle='#5f9a4c'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(0,20); ctx.lineTo(0,-2); ctx.stroke(); ell(-7,10,7,3,'#6aa653',-.5); for(let i=0;i<12;i++){ const a=i/12*Math.PI*2; ell(Math.cos(a)*11,-10+Math.sin(a)*11,7,3.2,'#f6c33a',a); } shade(0,-10,7,7,'#7a4a28','#4a2c18'); }
  else if(id==='florrosa'){ ctx.strokeStyle='#5f9a4c'; ctx.lineWidth=3.5; ctx.beginPath(); ctx.moveTo(0,20); ctx.lineTo(0,-2); ctx.stroke(); ell(6,8,6,2.6,'#6aa653',.5); for(let i=0;i<5;i++){ const a=i/5*Math.PI*2-G*.3; shade(Math.cos(a)*7,-8+Math.sin(a)*7,6.5,6.5,'#f6a8bd','#d9708e'); } ell(0,-8,4,4,'#ffd860'); }
  else if(id==='bandeirinha'){ ctx.strokeStyle='#7a5a3a'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(-40,-10); ctx.quadraticCurveTo(0,4,40,-10); ctx.stroke(); const C=['#e0605a','#f6c33a','#6aa653','#6fa8e0','#b99be8','#f2a65e'];
    for(let i=0;i<6;i++){ const bx=-34+i*13.6, by=-10+Math.sin((bx+40)/80*Math.PI)*7; ctx.fillStyle=C[i]; ctx.beginPath(); ctx.moveTo(bx-5,by); ctx.lineTo(bx+5,by); ctx.lineTo(bx,by+11+Math.sin(G*3+i)*1); ctx.closePath(); ctx.fill(); } }
  else if(id==='arcoiris'){ const C=['#e0605a','#f2a65e','#f6c33a','#6aa653','#6fa8e0','#9a7ad8']; ctx.lineCap='butt'; C.forEach((c,i)=>{ ctx.strokeStyle=rgba(c,.85); ctx.lineWidth=5; ctx.beginPath(); ctx.arc(0,10,34-i*5,Math.PI,0); ctx.stroke(); }); ell(-30,12,10,6,'#fff'); ell(-22,10,8,6,'#fff'); ell(30,12,10,6,'#fff'); ell(22,10,8,6,'#fff'); }
  else if(id==='lampiao'){ ctx.strokeStyle='#5a3a22'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,-22); ctx.lineTo(0,-14); ctx.stroke(); glow(0,0,26,'#ffc060',.45+Math.sin(G*4)*.08); ctx.fillStyle='#5a3a22'; rr(-9,-15,18,4,2); ctx.fill(); rr(-9,12,18,4,2); ctx.fill(); ctx.fillStyle='#ffd27a'; rr(-7,-11,14,23,4); ctx.fill(); ell(0,2,3,5,'#fff6d8'); ctx.strokeStyle='#5a3a22'; ctx.lineWidth=1.5; ctx.strokeRect(-7,-11,14,23); }
  else if(id==='coracao'){ const bob=Math.sin(G*2)*3; ctx.strokeStyle='#8a7a6a'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,4+bob); ctx.quadraticCurveTo(4,16,0,24); ctx.stroke(); ctx.translate(0,bob); ctx.fillStyle=vgrad(-22,4,[[0,'#ff8a9a'],[1,'#d9465e']]); ctx.beginPath(); ctx.moveTo(0,4); ctx.bezierCurveTo(-22,-8,-14,-28,0,-16); ctx.bezierCurveTo(14,-28,22,-8,0,4); ctx.fill(); ell(-6,-15,3,4,'rgba(255,255,255,.55)',-.5); }
  else if(id==='estrela'){ glow(0,0,26,'#ffd860',.4); ctx.rotate(Math.sin(G*1.5)*.15); ctx.fillStyle=vgrad(-16,16,[[0,'#ffe68a'],[1,'#e8a830']]); ctx.beginPath(); for(let i=0;i<10;i++){ const r=i%2?7:17, a=-Math.PI/2+i*Math.PI/5; ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r); } ctx.closePath(); ctx.fill(); }
  else if(id==='borboleta'){ const f=Math.abs(Math.sin(G*9)); ctx.save(); ctx.scale(.35+.65*f,1); ell(-8,-5,9,8,'#b99be8'); ell(8,-5,9,8,'#b99be8'); ell(-6,6,6,6,'#f2a6c8'); ell(6,6,6,6,'#f2a6c8'); ell(-8,-5,3,3,'#fff6'); ell(8,-5,3,3,'#fff6'); ctx.restore(); ell(0,0,2,9,'#4a3a5a'); ctx.strokeStyle='#4a3a5a'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,-8); ctx.lineTo(-4,-14); ctx.moveTo(0,-8); ctx.lineTo(4,-14); ctx.stroke(); }
  else if(id==='sol'){ ctx.save(); ctx.rotate(G*.3); ctx.strokeStyle='#f6c33a'; ctx.lineWidth=4; ctx.lineCap='round'; for(let i=0;i<10;i++){ const a=i/10*Math.PI*2; ctx.beginPath(); ctx.moveTo(Math.cos(a)*19,Math.sin(a)*19); ctx.lineTo(Math.cos(a)*25,Math.sin(a)*25); ctx.stroke(); } ctx.restore();
    shade(0,0,15,15,'#ffe27a','#f2b134'); ell(-5,-3,1.8,2.2,'#7a4a28'); ell(5,-3,1.8,2.2,'#7a4a28'); ell(-9,3,3,2,'rgba(240,120,100,.5)'); ell(9,3,3,2,'rgba(240,120,100,.5)'); ctx.strokeStyle='#7a4a28'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.arc(0,2,5,.3,Math.PI-.3); ctx.stroke(); }
  else if(id==='concha'){ ctx.fillStyle=vgrad(-14,8,[[0,'#ffd8c8'],[1,'#e89a84']]); ctx.beginPath(); ctx.moveTo(0,8); for(let i=0;i<=8;i++){ const a=Math.PI+i*Math.PI/8; ctx.quadraticCurveTo(Math.cos(a-.2)*20,Math.sin(a-.2)*20-2,Math.cos(a)*17,Math.sin(a)*17-2); } ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(180,100,80,.6)'; ctx.lineWidth=1.3; for(let i=1;i<8;i++){ const a=Math.PI+i*Math.PI/8; ctx.beginPath(); ctx.moveTo(0,6); ctx.lineTo(Math.cos(a)*15,Math.sin(a)*15-2); ctx.stroke(); } ell(0,8,5,3,'#e89a84'); }
  ctx.restore(); }

/* ===== base comum dos jogos clássicos ===== */
const $ = id => document.getElementById(id);
// narradora (mesma voz dos filmes)
const voice = new Audio(); let voiceOn = true;
function say(k){ if(!voiceOn || !REC[k]) return; try{ voice.pause(); voice.src = REC[k]; voice.currentTime = 0; voice.play().catch(()=>{}); }catch(e){} }
function toggleVoice(btn){ voiceOn = !voiceOn; btn.textContent = voiceOn? '🔊' : '🔇'; btn.setAttribute('aria-label', voiceOn? 'Narração ligada' : 'Narração desligada'); if(!voiceOn) voice.pause(); }
// sons curtinhos
let AC=null;
function ac(){ try{ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} return AC; }
function tone(n,dur,vol,delay,type){ const a=ac(); if(!a) return; const t0=a.currentTime+(delay||0); const o=a.createOscillator(); o.type=type||'sine'; o.frequency.value=440*Math.pow(2,(n-69)/12);
  const g=a.createGain(); g.gain.setValueAtTime(vol||.08,t0); g.gain.exponentialRampToValueAtTime(.0005,t0+(dur||.5)); o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+(dur||.5)+.05); }
const sfx={ tap:()=>tone(76,.12,.05), good:()=>{ tone(76,.4,.07); tone(81,.5,.06,.08); }, bad:()=>{ tone(52,.25,.06,0,'triangle'); tone(49,.3,.05,.1,'triangle'); }, win:()=>[72,76,79,84].forEach((n,i)=>tone(n,.7,.07,i*.13)) };
// estrelas guardadas no aparelho (a estante mostra)
function saveStars(key,st){ try{ localStorage.setItem(key, Math.max(+(localStorage.getItem(key)||0), st)); }catch(e){}  if(window.bpAddCoins) setTimeout(()=>bpAddCoins(st*2,'pelo jogo!'),700); }
function starText(st){ return '⭐'.repeat(st)+'☆'.repeat(3-st); }
// confete
function confetti(){ const c=$('confetti'); if(!c) return; const x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight; const P=[]; const cols=['#e8b65a','#d97b6c','#6aa653','#6fa8e0','#b99be8'];
  for(let i=0;i<120;i++) P.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6,c:cols[i%5]});
  let t=0; (function f(){ t++; x.clearRect(0,0,c.width,c.height); for(const p of P){ p.x+=p.vx; p.y+=p.vy; p.r+=.1; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-5,-3,10,6); x.restore(); } if(t<240) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height); })(); }
// retratos com o mesmo desenho dos filmes
const ANIMAIS=['ovelha','leao','elefante','girafa','pomba','coelho'];
function portrait(id,size,bg){ const dpr=Math.min(devicePixelRatio||1,2); const c=document.createElement('canvas'); c.width=c.height=Math.round(size*dpr); c.style.width=c.style.height=size+'px';
  ctx=c.getContext('2d'); ctx.scale(dpr,dpr);
  const g=ctx.createRadialGradient(size/2,size*.4,size*.1,size/2,size/2,size*.7); g.addColorStop(0,bg?bg[0]:'#fff8e8'); g.addColorStop(1,bg?bg[1]:'#f0dcb8'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(size/2,size/2,size/2,0,7); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(size/2,size/2,size/2-1,0,7); ctx.clip();
  if(id==='arca'){ ctx.translate(size/2,size*.78); const k=size/330; ctx.scale(k,k); ark(0,0,1,{lit:.6,ramp:1,doorLit:.6}); }
  else if(ANIMAIS.includes(id)){ ctx.translate(size/2,size*(id==='girafa'?.92:.8)); const k=size/(id==='girafa'?120:(id==='elefante'?90:72)); ctx.scale(k,k); animal(id,id==='pomba'?-4:0,id==='pomba'?-20:0,id==='pomba'?1.8:1,1,0); }
  else { const C=CAST[id]; const k=size/(118*C.s); ctx.translate(size/2,size*1.02); ctx.scale(k,k); person(id,0,0,{pose:'stand',dir:1}); }
  ctx.restore(); ctx.strokeStyle='rgba(120,90,50,.35)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(size/2,size/2,size/2-1,0,7); ctx.stroke(); return c; }
// histórias (mesma ordem da estante)
const STORIES=[
  { id:'criacao', name:'A Criação', who:'adao', ref:'Gênesis 1–2' },
  { id:'noe', name:'Noé e a Arca', who:'noe', ref:'Gênesis 6–9' },
  { id:'davi', name:'Davi e Golias', who:'davi', ref:'1 Samuel 17' },
  { id:'jonas', name:'Jonas', who:'jonas', ref:'Jonas 1–4' },
  { id:'natal', name:'O Nascimento de Jesus', who:'maria', ref:'Lucas 2 · Mateus 2' },
  { id:'tempestade', name:'Jesus Acalma a Tempestade', who:'jesus', ref:'Marcos 4' },
];

// configuração da Área dos Pais
try{ const _c=JSON.parse(localStorage.getItem('bp_cfg')||'{}'); if(_c.voz===false){ voiceOn=false; addEventListener('DOMContentLoaded',()=>{}); setTimeout(()=>{ const b=document.getElementById('vo'); if(b){ b.textContent='🔇'; b.setAttribute('aria-label','Narração desligada'); } },0); } }catch(e){}

const POOL=['noe','davi','golias','jonas','jesus','pedro','adao','eva','saul','maria','jose','anjo','ovelha','leao','elefante','girafa','pomba','coelho','arca'];
const NAME={noe:'Noé',davi:'Davi',golias:'Golias',jonas:'Jonas',jesus:'Jesus',pedro:'Pedro',adao:'Adão',eva:'Eva',saul:'Rei Saul',ovelha:'Ovelha',leao:'Leão',elefante:'Elefante',girafa:'Girafa',pomba:'Pomba',coelho:'Coelho',arca:'Arca',maria:'Maria',jose:'José',anjo:'Anjo'};
const LEVELS=[ {id:'f',name:'Fácil',pairs:6,cols:3,who:'ovelha'}, {id:'m',name:'Médio',pairs:8,cols:4,who:'noe'}, {id:'d',name:'Difícil',pairs:10,cols:4,who:'golias'} ];
let L=null, first=null, lock=false, moves=0, found=0;
const lv=$('levels');
LEVELS.forEach(l=>{ const b=document.createElement('button'); b.className='choice'; b.appendChild(portrait(l.who,96)); b.insertAdjacentHTML('beforeend',`<span>${l.name}</span><small>${l.pairs} pares · ${l.pairs*2} cartas</small>`); b.onclick=()=>{ sfx.tap(); start(l); }; lv.appendChild(b); });
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function start(l){ L=l; first=null; lock=false; moves=0; found=0; $('pick').hidden=true; $('game').hidden=false; $('win').hidden=true;
  const ids=shuffle(POOL.slice()).slice(0,l.pairs); const deck=shuffle([...ids,...ids]);
  const cols = innerWidth<520? Math.min(l.cols,4) : (l.pairs===10? 5 : l.cols);
  const bd=$('board'); bd.innerHTML=''; bd.style.gridTemplateColumns=`repeat(${cols},1fr)`; bd.style.maxWidth = (cols*128)+'px';
  deck.forEach((id,i)=>{ const c=document.createElement('button'); c.className='card'; c.dataset.id=id; c.setAttribute('aria-label','Carta '+(i+1));
    c.innerHTML='<div class="in"><div class="face back"><span>✦</span></div><div class="face front"><em>'+NAME[id]+'</em></div></div>';
    const cv=portrait(id,110,['#fffaf0','#f3e2c0']); cv.style.width='100%'; cv.style.height='auto'; c.querySelector('.front').prepend(cv);
    c.onclick=()=>flip(c); bd.appendChild(c); });
  upd(); say('mi'); }
function upd(){ $('pairs').textContent=found+' / '+L.pairs; $('moves').textContent=moves; }
function flip(c){ if(lock || c.classList.contains('up') || c.classList.contains('done')) return; ac(); sfx.tap(); c.classList.add('up');
  if(!first){ first=c; return; }
  moves++; upd(); const a=first, b=c; first=null;
  if(a.dataset.id===b.dataset.id){ setTimeout(()=>{ a.classList.add('done'); b.classList.add('done'); a.classList.remove('up'); b.classList.remove('up'); a.setAttribute('aria-label',NAME[a.dataset.id]); b.setAttribute('aria-label',NAME[b.dataset.id]); sfx.good(); say('m_'+a.dataset.id); found++; upd(); if(found===L.pairs) setTimeout(win,900); },350); }
  else { lock=true; setTimeout(()=>{ a.classList.add('shake'); b.classList.add('shake'); sfx.bad(); },450); setTimeout(()=>{ a.classList.remove('up','shake'); b.classList.remove('up','shake'); lock=false; },1100); } }
function win(){ const st = moves<=L.pairs*1.6? 3 : (moves<=L.pairs*2.4? 2 : 1); saveStars('bp_memoria_estrelas',st);
  $('wStars').textContent=starText(st); $('wRes').textContent='Nível '+L.name+' · '+moves+' jogadas'; $('win').hidden=false; sfx.win(); confetti(); setTimeout(()=>say('mf'),400); }
$('restart').onclick=()=>start(L); $('again').onclick=()=>start(L); $('other').onclick=()=>{ $('win').hidden=true; $('game').hidden=true; $('pick').hidden=false; };
$('vo').onclick=e=>toggleVoice(e.currentTarget);
window.__mem={start,LEVELS};
</script>

function bpToast(msg){ let t=document.querySelector('.bp-toast'); if(!t){ t=document.createElement('div'); t.className='bp-toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
  t.textContent=msg; requestAnimationFrame(()=>t.classList.add('on')); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2600); }
