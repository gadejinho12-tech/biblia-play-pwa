<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="conta-config.js"></script><script src="conta.js"></script>
<title>Caça-Palavras Bíblico</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,500&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Visual único dos jogos clássicos: papel creme de livro ilustrado, igual à estante e aos filmes. */
:root{
  --paper:#fbf3e3; --paper2:#f3e6cc; --card:#fffaf0; --ink:#3a2c24; --muted:#7d6a58; --gold:#c98a3a; --gold2:#e8b65a;
  --leaf:#5f9a4c; --sky:#6fa8e0; --rose:#d97b6c; --ok:#6aa653; --bad:#d9634f;
  --display:'Fraunces', Georgia, 'Times New Roman', serif; --body:'Nunito', system-ui, sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none;
  background-image:radial-gradient(circle at 12% 0%, rgba(232,182,90,.18), transparent 40%), radial-gradient(circle at 92% 8%, rgba(111,168,224,.15), transparent 40%);
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:12px 32px}
.wrap{max-width:900px;margin:0 auto;display:grid;gap:16px}
.wrap .wrap{width:100%;max-width:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:6px 0;background:var(--paper)}
.top h1{font:800 clamp(22px,5.4vw,32px)/1 var(--display);margin:0;text-align:center;flex:1;text-wrap:balance}
.pill{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font:800 14px var(--body);border-radius:999px;padding:9px 14px;background:var(--card);box-shadow:0 0 0 1px rgba(120,90,50,.15);border:0;cursor:pointer}
.pill:focus-visible,.btn:focus-visible,.opt:focus-visible,.choice:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn{border:0;border-radius:999px;padding:13px 24px;font:800 17px var(--body);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.go{color:#fff;background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:0 8px 20px rgba(201,138,58,.3)}
.btn.ghost{color:var(--ink);background:transparent;border:2px solid rgba(58,44,36,.18)}
.seg{display:inline-flex;background:var(--card);border-radius:999px;padding:4px;gap:4px;box-shadow:0 0 0 1px rgba(120,90,50,.15);flex-wrap:wrap;justify-content:center}
.seg button{border:0;background:transparent;border-radius:999px;padding:9px 16px;font:800 14px var(--body);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.lead{margin:0;color:var(--muted);text-align:center;line-height:1.5}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.choice{background:var(--card);border:0;border-radius:16px;padding:14px 12px;display:grid;justify-items:center;gap:8px;cursor:pointer;box-shadow:0 10px 24px rgba(90,60,30,.12), 0 0 0 1px rgba(120,90,50,.1);font:800 16px/1.2 var(--display);color:var(--ink)}
.choice canvas{width:96px;height:96px}
.choice small{font:700 12px var(--body);color:var(--muted)}
.stars{font-size:38px;letter-spacing:6px}
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;background:rgba(40,28,20,.35);padding:20px 16px}
.page{margin:auto;background:var(--paper);border-radius:8px;box-shadow:0 24px 60px rgba(0,0,0,.3), inset 0 0 0 1px rgba(120,90,50,.15), inset 0 0 60px rgba(200,160,100,.22);padding:26px 28px;text-align:center;max-width:440px;display:grid;gap:12px;justify-items:center;transform:rotate(-.5deg)}
.page h2{font:800 clamp(30px,8vw,42px)/1.05 var(--display);margin:0}
.eyebrow{font:800 12px var(--body);letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

/* Layout: escolha da história e do nível; depois a grade de letras com a lista de palavras ao lado (embaixo no celular). */
.play{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:18px;align-items:start}
@media (max-width:720px){ .play{grid-template-columns:1fr} }
.gridbox{width:100%;justify-self:center;position:relative;background:var(--card);border-radius:14px;padding:10px;box-shadow:0 10px 24px rgba(90,60,30,.12), 0 0 0 1px rgba(120,90,50,.1);touch-action:none;max-width:100%}
.grid{display:grid;gap:3px;position:relative;z-index:1}
.cell{aspect-ratio:1;max-width:100%;display:grid;place-items:center;font:800 clamp(14px,4.2vw,24px)/1 var(--display);color:var(--ink);border-radius:8px;background:rgba(243,230,204,.55);transition:background .15s, transform .15s}
.cell.sel{background:#ffe39a;transform:scale(1.06)}
svg.marks{position:absolute;inset:10px;z-index:2;pointer-events:none;overflow:visible}
.words{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:0 0 0 1px rgba(120,90,50,.1);display:grid;gap:10px}
.words .who{display:flex;align-items:center;gap:10px;font:800 16px/1.2 var(--display)}
.words ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.words li{font:800 15px var(--body);letter-spacing:.06em;padding:6px 10px;border-radius:999px;background:var(--paper2)}
.words li.got{text-decoration:line-through;opacity:.55}
.bar{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;align-items:center;font:800 15px var(--body);color:var(--muted)}
.bar b{color:var(--ink);font-variant-numeric:tabular-nums}
.levelrow{display:flex;justify-content:center}
</style>
<canvas id="confetti"></canvas>
<div class="wrap">
  <div class="top"><a class="pill" href="index.html">📚 Estante</a><h1>Caça-Palavras</h1><button class="pill" id="vo" aria-label="Narração ligada">🔊</button></div>
  <section id="pick" class="wrap">
    <p class="lead">Escolha o nível e a história. As palavras escondidas são da própria história!</p>
    <div class="levelrow"><div class="seg" id="lvl" role="group" aria-label="Nível"></div></div>
    <div class="choices" id="stories"></div>
  </section>
  <section id="game" class="wrap" hidden>
    <div class="bar"><span>Achadas: <b id="cnt">0 / 0</b></span><span>Tempo: <b id="time">0:00</b></span><button class="pill" id="hint">💡 Dica</button><button class="pill" id="back">↩ Outra história</button></div>
    <div class="play">
      <div class="gridbox" id="gbox"><div class="grid" id="grid"></div><svg class="marks" id="marks"></svg></div>
      <div class="words"><div class="who" id="who"></div><ul id="list"></ul></div>
    </div>
  </section>
</div>
<div class="overlay" id="win" hidden><div class="page"><div class="bp-hello" hidden><img alt=""><span></span></div><span class="eyebrow">Caça-palavras</span><h2>Achou todas! 🎉</h2><div class="stars" id="wStars"></div><p class="lead" id="wRes"></p>
  <div class="row"><button class="btn go" id="again">↻ Jogar de novo</button><button class="btn ghost" id="other">Outra história</button><a class="btn ghost" href="index.html">📚 Estante</a></div></div></div>

/* arte.js — o mesmo desenho dos personagens dos filmes do Biblinha Play */
let ctx=null; let G=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
const ss=(a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const hex=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));
const mix=(a,b,t)=>{ const A=hex(a),B=hex(b); return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')'; };
const rgba=(h,a)=>{ const c=hex(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };

/* ===== luz da cena (todas as cenas usam o mesmo sistema) ===== */
const LIGHT={dx:1, rim:'#fff1c8', rimA:.55};
function vgrad(y0,y1,stops){ const g=ctx.createLinearGradient(0,y0,0,y1); stops.forEach(([o,c])=>g.addColorStop(o,c)); return g; }
function ell(x,y,rx,ry,fill,rot){ ctx.beginPath(); ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,7); ctx.fillStyle=fill; ctx.fill(); }
function shade(x,y,rx,ry,top,bot,rot){ ell(x,y,rx,ry,vgrad(y-ry,y+ry,[[0,top],[1,bot]]),rot); }
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function build(){ const N=lv.size; for(let tries=0;tries<60;tries++){
  grid=Array.from({length:N},()=>Array(N).fill('')); placed=[];
  const pool=shuffle(WORDS[story.id].filter(w=>w.length<=Math.min(lv.max,N))).slice(0,lv.n).sort((a,b)=>b.length-a.length); let ok=true;
  for(const w of pool){ let done=false;
    for(let k=0;k<200 && !done;k++){ const [dr,dc]=lv.dirs[Math.floor(Math.random()*lv.dirs.length)]; const r0=Math.floor(Math.random()*N), c0=Math.floor(Math.random()*N);
      const r1=r0+dr*(w.length-1), c1=c0+dc*(w.length-1); if(r1<0||r1>=N||c1<0||c1>=N) continue;
      let fit=true; for(let i=0;i<w.length;i++){ const ch=grid[r0+dr*i][c0+dc*i]; if(ch && ch!==w[i]){ fit=false; break; } } if(!fit) continue;
      for(let i=0;i<w.length;i++) grid[r0+dr*i][c0+dc*i]=w[i]; placed.push({w,r0,c0,r1,c1}); done=true; }
    if(!done){ ok=false; break; } }
  if(ok) break; }
  const A='ABCDEFGHIJLMNOPRSTUVZ'; for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(!grid[r][c]) grid[r][c]=A[Math.floor(Math.random()*A.length)]; }
function start(s){ story=s; found=new Set(); build(); $('pick').hidden=true; $('game').hidden=false; $('win').hidden=true;
  const N=lv.size, g=$('grid'); g.innerHTML=''; g.style.gridTemplateColumns=`repeat(${N},1fr)`; $('gbox').style.maxWidth=(N*54+20)+'px';
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){ const d=document.createElement('div'); d.className='cell'; d.textContent=grid[r][c]; d.dataset.r=r; d.dataset.c=c; g.appendChild(d); }
  $('marks').innerHTML=''; const who=$('who'); who.innerHTML=''; who.appendChild(portrait(s.who,56)); who.insertAdjacentHTML('beforeend','<span>'+s.name+'</span>');
  const ul=$('list'); ul.innerHTML=''; placed.map(p=>p.w).sort().forEach(w=>{ const li=document.createElement('li'); li.textContent=w; li.dataset.w=w; ul.appendChild(li); });
  t0=Date.now(); clearInterval(timer); timer=setInterval(tick,500); tick(); upd(); say('ci'); }
function tick(){ const s=Math.floor((Date.now()-t0)/1000); $('time').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function upd(){ $('cnt').textContent=found.size+' / '+placed.length; }
function cellAt(x,y){ const el=document.elementFromPoint(x,y); return el && el.classList.contains('cell')? el : null; }
function path(a,b){ const r0=+a.dataset.r,c0=+a.dataset.c,r1=+b.dataset.r,c1=+b.dataset.c; const dr=Math.sign(r1-r0), dc=Math.sign(c1-c0); const n=Math.max(Math.abs(r1-r0),Math.abs(c1-c0));
  if(!(r0===r1||c0===c1||Math.abs(r1-r0)===Math.abs(c1-c0))) return null; const out=[]; for(let i=0;i<=n;i++) out.push([r0+dr*i,c0+dc*i]); return out; }
function cellsOf(p){ const g=$('grid'); return p.map(([r,c])=>g.children[r*lv.size+c]); }
function clearSel(){ document.querySelectorAll('.cell.sel').forEach(e=>e.classList.remove('sel')); }
const gb=$('gbox');
gb.addEventListener('pointerdown',e=>{ const c=cellAt(e.clientX,e.clientY); if(!c) return; ac(); drag={a:c,p:[[+c.dataset.r,+c.dataset.c]]}; clearSel(); c.classList.add('sel'); gb.setPointerCapture(e.pointerId); });
gb.addEventListener('pointermove',e=>{ if(!drag) return; const c=cellAt(e.clientX,e.clientY); if(!c) return; const p=path(drag.a,c); if(!p) return; drag.p=p; clearSel(); cellsOf(p).forEach(x=>x.classList.add('sel')); });
gb.addEventListener('pointerup',()=>{ if(!drag) return; const p=drag.p; drag=null; clearSel(); if(p.length<2) return;
  const word=p.map(([r,c])=>grid[r][c]).join(''), rev=[...word].reverse().join('');
  const hit=placed.find(q=>!found.has(q.w) && (q.w===word||q.w===rev) && ((q.r0===p[0][0]&&q.c0===p[0][1])||(q.r1===p[0][0]&&q.c1===p[0][1])));
  if(hit){ found.add(hit.w); mark(hit,found.size-1); document.querySelector('li[data-w="'+hit.w+'"]').classList.add('got'); sfx.good(); upd();
    if(found.size===placed.length) setTimeout(win,600); else say('ca'); } else sfx.bad(); });
function mark(q,i){ const g=$('grid'), a=g.children[q.r0*lv.size+q.c0], b=g.children[q.r1*lv.size+q.c1], gr=g.getBoundingClientRect(), ra=a.getBoundingClientRect(), rb=b.getBoundingClientRect();
  const x1=ra.left+ra.width/2-gr.left, y1=ra.top+ra.height/2-gr.top, x2=rb.left+rb.width/2-gr.left, y2=rb.top+rb.height/2-gr.top;
  const ln=document.createElementNS('http://www.w3.org/2000/svg','line'); ln.setAttribute('x1',x1); ln.setAttribute('y1',y1); ln.setAttribute('x2',x2); ln.setAttribute('y2',y2);
  ln.setAttribute('stroke',COLORS[i%COLORS.length]); ln.setAttribute('stroke-width',ra.width*.78); ln.setAttribute('stroke-linecap','round'); ln.setAttribute('opacity','.55'); $('marks').appendChild(ln); }
addEventListener('resize',()=>{ if(!$('game').hidden){ $('marks').innerHTML=''; [...found].forEach((w,i)=>mark(placed.find(q=>q.w===w),i)); } });
$('hint').onclick=()=>{ const q=placed.find(q=>!found.has(q.w)); if(!q) return; const c=$('grid').children[q.r0*lv.size+q.c0]; c.classList.add('sel'); setTimeout(()=>c.classList.remove('sel'),1200); sfx.tap(); t0-=15000; };
function win(){ clearInterval(timer); const s=Math.floor((Date.now()-t0)/1000); const stars = s<=lv.t[0]? 3 : (s<=lv.t[1]? 2 : 1); saveStars('bp_cacapalavras_estrelas',stars);
  $('wStars').textContent=starText(stars); $('wRes').textContent=story.name+' · nível '+lv.name+' · '+$('time').textContent; $('win').hidden=false; sfx.win(); confetti(); setTimeout(()=>say('cf'),300); }
$('again').onclick=()=>start(story); $('other').onclick=$('back').onclick=()=>{ clearInterval(timer); $('win').hidden=true; $('game').hidden=true; $('pick').hidden=false; };
$('vo').onclick=e=>toggleVoice(e.currentTarget);
window.__cp={get placed(){return placed;}, get lv(){return lv;}, start, STORIES};
</script>

<script>
/* moedinhas: ganhas nos filmes, jogos e no baú do dia; gastas na "Minha Arca" */
function bpCoins(){ try{ return +(localStorage.getItem('bp_moedas')||0); }catch(e){ return 0; } }
function bpToast(msg){ let t=document.querySelector('.bp-toast'); if(!t){ t=document.createElement('div'); t.className='bp-toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
  t.textContent=msg; requestAnimationFrame(()=>t.classList.add('on')); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2600); }
function bpAddCoins(n,why){ n=Math.round(n); if(!(n>0)) return; try{ localStorage.setItem('bp_moedas', bpCoins()+n); }catch(e){ return; } bpToast('+'+n+' 🪙 '+(why||'moedinhas!')); }
</script>
