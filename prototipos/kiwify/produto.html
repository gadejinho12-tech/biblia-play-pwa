<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@800&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:300px;height:250px;overflow:hidden;font-family:'Baloo 2',sans-serif;color:#2B3A55}
.c{position:relative;width:300px;height:250px;background:linear-gradient(#9fdcff,#e4f6ff 70%);overflow:hidden}
.sol{position:absolute;right:-18px;top:-18px;width:86px;height:86px;border-radius:50%;background:#FFC93C;box-shadow:0 0 0 12px #FFC93C33,0 0 0 26px #FFC93C1a}
.nv{position:absolute;background:#fff;border-radius:30px;height:18px}
.nv:before,.nv:after{content:"";position:absolute;background:#fff;border-radius:50%}
.nv:before{width:24px;height:24px;left:9px;top:-12px}.nv:after{width:18px;height:18px;left:27px;top:-7px}
.morro{position:absolute;left:-30px;right:-30px;bottom:-70px;height:130px;background:#62BD45;border-radius:50% 50% 0 0}
.morro2{position:absolute;right:-60px;width:220px;bottom:-80px;height:120px;background:#7DCB5E;border-radius:50% 50% 0 0}
.lili{position:absolute;left:8px;bottom:4px;width:140px}
.logo{position:absolute;right:12px;top:58px;text-align:right}
.nome{font-size:40px;font-weight:800;line-height:.9;letter-spacing:-.5px}
.nome b{color:#FF8A3D}
.play{display:inline-flex;align-items:center;gap:4px;margin-top:4px;background:#FFC93C;border-radius:999px;padding:2px 12px 0 9px;font-size:24px;font-weight:800;box-shadow:0 3px 0 #E0A21B;transform:rotate(-4deg)}
.play i{border-left:13px solid #2B3A55;border-top:8px solid transparent;border-bottom:8px solid transparent}
.sub{position:absolute;right:12px;top:142px;width:150px;text-align:right;font:800 12.5px/1.25 Nunito,sans-serif}
.idade{position:absolute;right:12px;bottom:12px;background:#fff;border-radius:999px;padding:3px 10px;font:800 11.5px Nunito,sans-serif;box-shadow:0 2px 0 #3f8a30}
</style></head><body><div class="c">
<div class="sol"></div><div class="nv" style="width:56px;left:14px;top:30px"></div><div class="nv" style="width:44px;left:120px;top:20px;transform:scale(.8)"></div>
<div class="morro2"></div><div class="morro"></div>
<img class="lili" src="../../filmes/lili.svg" alt="">
<div class="logo"><div class="nome">Bibli<b>nha</b></div><div class="play"><i></i>Play</div></div>
<div class="sub">Histórias da Bíblia para assistir e brincar</div>
<div class="idade">🧒 3 a 7 anos</div>
</div></body></html>
